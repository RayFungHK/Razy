# =============================================================================
# deploy/k8s/secret.yaml — runtime secrets for the Razy worker fleet
# =============================================================================
# PURPOSE
#   Example Opaque Secret consumed by deploy/k8s/deployment.yaml via
#   `envFrom.secretRef`. Every value below is a PLACEHOLDER — this file is safe
#   to commit, real values are not.
#
# 15000-TPS RELEVANCE
#   None of these secrets create throughput by themselves, but two of them decide
#   whether a 15k-TPS deployment is deployable at all:
#     * RAZY_BRIDGE_SECRET — with it set, Module::executeBridgeCommand() rejects
#       cross-distributor bridge calls that lack a valid HMAC
#       (Razy\BridgeSignature). Without it the gate is off and RZ-002 rests
#       entirely on each module implementing __onBridgeCall. Load it as an env
#       var, never in config.inc.php.
#     * RAZY_ALLOW_INSECURE_TRANSPORT — must stay "0"/unset in production; it is
#       the operator opt-in that lets PackageManager/RepoInstaller install from
#       plain-HTTP distribution URLs. A fleet that can silently fetch modules
#       over HTTP is not a fleet you can autoscale to 20 pods.
#
# DO NOT COMMIT REAL VALUES
#   Replace this file with one of:
#     * SealedSecrets / SOPS-encrypted Secret   (git-friendly)
#     * ExternalSecrets / Secrets Store CSI driver (vault, CloudSecrets, ...)
#   Then keep the SAME key names — deployment.yaml references this Secret by name,
#   not by individual keys, so adding/rotating keys needs no manifest change.
#
# ROTATION (bridge secret, zero-downtime)
#   BridgeSignature supports a dual-accept window: put the outgoing value in
#   RAZY_BRIDGE_SECRET_OLD and the new one in RAZY_BRIDGE_SECRET, roll the pods,
#   then clear RAZY_BRIDGE_SECRET_OLD in the next change (see
#   architecture/CROSS-TENANT-PROCESS-FLOW.md risk register R9).
#
# APPLY
#   kubectl -n razy-prod apply -f deploy/k8s/secret.yaml
#   # ...or after editing the values:
#   kubectl -n razy-prod create secret generic razy-runtime-secrets \
#     --from-literal=RAZY_BRIDGE_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: razy-runtime-secrets
  namespace: razy-prod
  labels:
    app.kubernetes.io/name: razy
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: razy-platform
type: Opaque
stringData:
  # --- Cross-distributor bridge HMAC -------------------------------------------
  # Read by Razy\BridgeSignature (src/library/Razy/BridgeSignature.php:27-37) and
  # enforced by Module::executeBridgeCommand() (src/library/Razy/Module.php:526-534).
  # Requirement: >= 32 bytes of entropy; the framework refuses weak values.
  # Generate:  openssl rand -hex 32
  RAZY_BRIDGE_SECRET: "REPLACE-ME-32-plus-random-bytes-0000000000"

  # Previous value during a rotation window. Keep EMPTY unless rotating
  # (dual-accept window; clear it in the following change).
  RAZY_BRIDGE_SECRET_OLD: ""

  # --- Module transport policy --------------------------------------------------
  # "1" allows installing modules from insecure (http://) distribution URLs —
  # src/library/Razy/PackageManager.php:115,257 and
  # src/library/Razy/RepoInstaller.php:624-626. Production must keep this "0".
  RAZY_ALLOW_INSECURE_TRANSPORT: "0"

  # --- Health endpoint deep tier (optional) -------------------------------------
  # Only used by GET /_razy/health?token=... and gated in
  # src/library/Razy/Health.php:100-111. Empty = deep tier disabled (recommended);
  # probes never need it, the default tier needs no token at all.
  RAZY_HEALTH_TOKEN: ""

  # --- Application data plane ---------------------------------------------------
  # NOT framework APIs: Razy reads database/session/cache settings from
  # config.inc.php, so these names are the convention your site's config.inc.php
  # should getenv() (same pattern as RAZY_DEBUG / RAZY_TIMEZONE /
  # RAZY_PHAR_LOCATION in deploy/Dockerfile.worker). Point them at a connection
  # pooler (ProxySQL / RDS Proxy), not at MySQL directly — see
  # deploy/k8s/README.md "Mandatory prerequisites".
  RAZY_DB_HOST: "proxysql.razy-prod.svc.cluster.local"
  RAZY_DB_PORT: "6033"
  RAZY_DB_NAME: "razy"
  RAZY_DB_USER: "razy_app"
  RAZY_DB_PASS: "REPLACE-ME-db-password"

  # Redis session/cache backends (required before >1 pod can share state).
  RAZY_REDIS_SESSION_HOST: "redis.razy-prod.svc.cluster.local"
  RAZY_REDIS_SESSION_PORT: "6379"
  RAZY_REDIS_CACHE_HOST: "redis.razy-prod.svc.cluster.local"
  RAZY_REDIS_CACHE_PORT: "6379"
