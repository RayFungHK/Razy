# Edge proxy (nginx) — path-split between a sibling app and a Razy deployment.
#
# Topology A in README.md. This file is OPERATOR-OWNED — nothing here is generated by
# `php Razy.phar rewrite`, and nothing Razy generates needs to be hand-edited for this
# topology to work. Adjust upstream addresses and TLS paths to your environment.

# The sibling app. In this sample: a Python (uvicorn/gunicorn) service on :8000.
upstream sibling_py {
    server 127.0.0.1:8000;
}

# The Razy deployment behind it — Apache/mod_php, FrankenPHP, php-fpm behind its own
# frontend, whatever; nginx only sees HTTP.
upstream razy_app {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ── Sibling prefix ──
    # '^~' beats regex locations: nothing "cleverer" can steal this prefix back.
    # Trailing slash on proxy_pass strips /api-py/ before the hop — remove it if the
    # sibling expects the full path (check its own root_path/router prefix).
    location ^~ /api-py/ {
        proxy_pass http://sibling_py;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
    }

    # ── Everything else goes to Razy ──
    # Preserve the full URI: Razy's own distributor/route matching runs inside
    # index.php (see manual/08-coexistence.md §1, "Claim 2"). Do NOT strip prefixes here.
    location / {
        proxy_pass http://razy_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # If you run health/metrics probes against the edge, forward the framework probes
    # explicitly (they are answered inside PHP, which only sees them if the path is
    # delivered — manual/08 §4 "does not do", dossier FM-5):
    # location = /_razy/health  { proxy_pass http://razy_app; }
    # location = /_razy/metrics { proxy_pass http://razy_app; }
}

# Plain-HTTP redirect omitted for brevity.
