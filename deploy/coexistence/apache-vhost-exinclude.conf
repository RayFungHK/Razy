# Same-host Apache coexistence — vhost piece for a Python sibling on a Razy-served host.
#
# Topology C in README.md. This file is OPERATOR-OWNED (vhost or an Include'd fragment,
# NOT .htaccess). Razy's `.htaccess` is machine-owned and regenerated by
# `php Razy.phar rewrite` — it must never be hand-edited here (RZ-013); the Razy-side
# half of this setup is the `exclude_paths` key in sites.inc.php
# (see sites.exclude.php.example next to this file).

<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/razy/public

    # ── Sibling app: declared BEFORE any per-directory rewrite logic can see it ──
    # vhost-level ProxyPass is evaluated before per-directory (.htaccess) rewriting, so
    # this mapping wins for its prefix; the 'exclude_paths' rule in the generated
    # .htaccess then guarantees that anything that still reaches the rewrite engine on
    # this prefix STOPS there instead of being rewritten to Razy's index.php.
    #   manual/08-coexistence.md §1 explains the two claims this defuses (FM-1/FM-2).
    ProxyPass        /api-py/ http://127.0.0.1:8000/
    ProxyPassReverse /api-py/ http://127.0.0.1:8000/

    # If the sibling lives in the docroot as a real directory instead of a proxied
    # upstream, the generated !-f/!-d/!-l conditions already spare it — but declaring
    # it in exclude_paths is still the explicit contract (dossier §2 FM-1: real-dir
    # survival is incidental, not promised).

    # Razy requires per-directory overrides for its generated rules to run at all:
    #   https://httpd.apache.org/docs/current/rewrite/htaccess.html#prerequisites
    <Directory /var/www/razy/public>
        AllowOverride FileInfo Options
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>

# Apply both halves of Topology C:
#   1. declare 'exclude_paths' => ['/api-py'] in sites.inc.php (sites.exclude.php.example)
#   2. php Razy.phar rewrite <dist>          (regenerates .htaccess)
#   3. apachectl -t && systemctl reload apache2
