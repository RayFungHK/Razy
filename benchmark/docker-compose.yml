# ============================================================
# Benchmark Docker Compose — Razy vs Laravel (symmetric runtimes)
# ============================================================
#
# Usage:
#   cd benchmark
#   docker compose up -d                          # mysql + Razy worker
#   docker compose --profile laravel up -d        # + Laravel worker (same runtime family)
#   docker compose --profile fpm up -d            # + PHP-FPM baselines (both apps, one Caddy front)
#
# Architecture (2026-09 symmetry re-run, COMPETITOR-LANDSCAPE.md §5):
#   k6 (host) ──► razy      :8081  FrankenPHP worker      ─┐
#             ──► laravel   :8082  Octane/frankenphp      ─┼─► mysql :13306
#             ──► fpm-caddy :8083 (razy-fpm) / :8084 (laravel-fpm, php:8.3-fpm) ┘
#
# The old table compared Razy-on-FrankenPHP vs Laravel-on-Swoole — a runtime
# verdict, not a framework one. Both stacks now share the identical FrankenPHP
# runtime; the fpm profile adds the plain-FPM baseline for both, per the audit.

services:
  # ── Shared MySQL Database (pin: bump with the Dockerfiles — one epoch) ──
  mysql:
    image: mysql:8.0.43
    container_name: bench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark
    ports:
      - "13306:3306"
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - bench_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Razy (FrankenPHP / Caddy Worker Mode) ──────────────────
  razy:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.razy
    container_name: bench-razy
    ports:
      - "8081:8080"
    environment:
      BENCH_DB_HOST: "mysql"
      BENCH_DB_DSN:  "mysql:host=mysql;port=3306;dbname=benchmark"
      BENCH_DB_USER: "benchmark"
      BENCH_DB_PASS: "benchmark"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── Laravel + Octane (FRANKENPHP driver — same runtime family) ──
  #    Activate with: docker compose --profile laravel up -d
  laravel:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.laravel
    container_name: bench-laravel
    profiles:
      - laravel
    ports:
      - "8082:8080"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: benchmark
      DB_USERNAME: benchmark
      DB_PASSWORD: benchmark
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── PHP-FPM baseline (audit recommendation): BOTH apps on plain fpm ──
  #    Activate with: docker compose --profile fpm up -d
  #    One Caddy fronts both: :8083 → razy-fpm, :8084 → laravel-fpm
  razy-fpm:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.razy-fpm
    container_name: bench-razy-fpm
    profiles:
      - fpm
    environment:
      BENCH_DB_HOST: "mysql"
      BENCH_DB_DSN:  "mysql:host=mysql;port=3306;dbname=benchmark"
      BENCH_DB_USER: "benchmark"
      BENCH_DB_PASS: "benchmark"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  laravel-fpm:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.laravel-fpm
    container_name: bench-laravel-fpm
    profiles:
      - fpm
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: benchmark
      DB_USERNAME: benchmark
      DB_PASSWORD: benchmark
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ---- assembly-scale fpm pair (EPOCH compiled-column instrument) ---------
  # Two arms, SAME phar + SAME site, one build ARG apart. Each arm fronts its
  # OWN single-server nginx (pair.conf.template) — the multi-block Caddy path
  # hung in-network FastCGI under Windows Docker (2026-09-17 live-fire, note
  # in Caddyfile.pair kept as evidence). Published ports 8091/8092: host
  # smoke is part of the pair protocol. Harness: benchmark/pair_ab.py.
  scale-proxy-compiled:
    image: nginx:1.27-alpine
    container_name: bench-scale-proxy-compiled
    profiles:
      - fpm
    entrypoint: ["sh", "-c", "sed -e s/__PORT__/8091/ -e s/__UPSTREAM__/scale-fpm-compiled/ /template/pair.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    volumes:
      - ./scale/pair.conf.template:/template/pair.conf.template:ro
    ports:
      - "8091:8091"
    depends_on:
      - scale-fpm-compiled

  scale-proxy-legacy:
    image: nginx:1.27-alpine
    container_name: bench-scale-proxy-legacy
    profiles:
      - fpm
    entrypoint: ["sh", "-c", "sed -e s/__PORT__/8092/ -e s/__UPSTREAM__/scale-fpm-legacy/ /template/pair.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    volumes:
      - ./scale/pair.conf.template:/template/pair.conf.template:ro
    ports:
      - "8092:8092"
    depends_on:
      - scale-fpm-legacy

  scale-fpm-compiled:
    build:
      context: ..
      dockerfile: benchmark/scale/Dockerfile.scale-fpm
      args:
        COMPILED: "1"
        SCALE: "60"
    container_name: bench-scale-fpm-compiled
    profiles:
      - fpm
    environment:
      # 0 = the shipping posture: the fingerprint now auto-shortens on its
      # own because this image's opcache runs validate_timestamps=0 (the
      # frozen-bytecode case). Set 1 to force-skip even without opcache.
      RAZY_COMPILE_TRUST: "0"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  scale-fpm-legacy:
    build:
      context: ..
      dockerfile: benchmark/scale/Dockerfile.scale-fpm
      args:
        COMPILED: "0"
        SCALE: "60"
    container_name: bench-scale-fpm-legacy
    profiles:
      - fpm
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  fpm-caddy:
    image: caddy:2.10-alpine
    container_name: bench-fpm-caddy
    profiles:
      - fpm
    ports:
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ./docker/Caddyfile.fpm:/etc/caddy/Caddyfile:ro
    depends_on:
      - razy-fpm
      - laravel-fpm

  # ---- gate site (v1.1 readiness-gate scenarios 07-09) -------------------
  gate:
    build:
      context: ..
      dockerfile: benchmark/gate/Dockerfile.gate
    container_name: bench-gate
    profiles:
      - gate
    ports:
      - "8085:8080"
    depends_on:
      - mysql

  # ---- scale site (scenario 10 boot curve; rebuild per SCALE) ------------
  # Usage:  docker compose build --build-arg SCALE=25 scale
  #         docker compose --profile scale up -d scale
  scale:
    build:
      context: ..
      dockerfile: benchmark/gate/Dockerfile.gate
      args:
        SCALE: "5"
    container_name: bench-scale
    profiles:
      - scale
    ports:
      - "8086:8080"
    depends_on:
      - mysql

volumes:
  bench_mysql_data:
