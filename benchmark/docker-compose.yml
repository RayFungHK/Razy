# ============================================================
# Benchmark Docker Compose — Razy vs Laravel (symmetric runtimes)
# ============================================================
#
# Usage:
#   cd benchmark
#   docker compose up -d                          # mysql + Razy worker
#   docker compose --profile laravel up -d        # + Laravel worker (same runtime family)
#   docker compose --profile fpm up -d            # + PHP-FPM baselines (both apps, one Caddy front)
#
# Architecture (2026-09 symmetry re-run, COMPETITOR-LANDSCAPE.md §5):
#   k6 (host) ──► razy      :8081  FrankenPHP worker      ─┐
#             ──► laravel   :8082  Octane/frankenphp      ─┼─► mysql :13306
#             ──► fpm-caddy :8083 (razy-fpm) / :8084 (laravel-fpm, php:8.3-fpm) ┘
#
# The old table compared Razy-on-FrankenPHP vs Laravel-on-Swoole — a runtime
# verdict, not a framework one. Both stacks now share the identical FrankenPHP
# runtime; the fpm profile adds the plain-FPM baseline for both, per the audit.

services:
  # ── Shared MySQL Database (pin: bump with the Dockerfiles — one epoch) ──
  mysql:
    image: mysql:8.0.43
    container_name: bench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark
    ports:
      - "13306:3306"
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - bench_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Razy (FrankenPHP / Caddy Worker Mode) ──────────────────
  razy:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.razy
    container_name: bench-razy
    ports:
      - "8081:8080"
    environment:
      BENCH_DB_HOST: "mysql"
      BENCH_DB_DSN:  "mysql:host=mysql;port=3306;dbname=benchmark"
      BENCH_DB_USER: "benchmark"
      BENCH_DB_PASS: "benchmark"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── Laravel + Octane (FRANKENPHP driver — same runtime family) ──
  #    Activate with: docker compose --profile laravel up -d
  laravel:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.laravel
    container_name: bench-laravel
    profiles:
      - laravel
    ports:
      - "8082:8080"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: benchmark
      DB_USERNAME: benchmark
      DB_PASSWORD: benchmark
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── PHP-FPM baseline (audit recommendation): BOTH apps on plain fpm ──
  #    Activate with: docker compose --profile fpm up -d
  #    One Caddy fronts both: :8083 → razy-fpm, :8084 → laravel-fpm
  razy-fpm:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.razy-fpm
    container_name: bench-razy-fpm
    profiles:
      - fpm
    environment:
      BENCH_DB_HOST: "mysql"
      BENCH_DB_DSN:  "mysql:host=mysql;port=3306;dbname=benchmark"
      BENCH_DB_USER: "benchmark"
      BENCH_DB_PASS: "benchmark"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  laravel-fpm:
    build:
      context: ..
      dockerfile: benchmark/docker/Dockerfile.laravel-fpm
    container_name: bench-laravel-fpm
    profiles:
      - fpm
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: benchmark
      DB_USERNAME: benchmark
      DB_PASSWORD: benchmark
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  fpm-caddy:
    image: caddy:2.10-alpine
    container_name: bench-fpm-caddy
    profiles:
      - fpm
    ports:
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ./docker/Caddyfile.fpm:/etc/caddy/Caddyfile:ro
    depends_on:
      - razy-fpm
      - laravel-fpm

volumes:
  bench_mysql_data:
