name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    # ready_for_review is what re-runs CI after a draft is marked ready (WS-26, 13w24).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, master, develop ]

# A newer PR push cancels the run still in progress. Each push to a default branch has its
# own group: GitHub keeps only one pending run per group, so a shared group would drop a
# third push even with cancel-in-progress false. A payload that still says draft can arrive
# after ready_for_review; automerge counts SKIPPED as success, so draft-state re-reads the
# live PR and the jobs run when it is no longer a draft.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  draft-state:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$PAYLOAD_DRAFT" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .draft)
          if [ "$live" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 8.5 added by PHP-85-READY (deprecations defused + PHPUnit 11.5); 8.2's
        # floor retires at its EOL (2026-12-31) per readme's support policy.
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      # generate-skills shipped broken for a whole product cycle printing
      # green ✓s — nothing outside the repo ever ran it (changelog v1.2.0
      # §Pre-tag). This step is the never-again: real build, real fixture
      # modules, real generate-skills run, assertions on generated FILE
      # CONTENT (guard itself proven to bite: negative-needle run exits 1).
      - name: generate-skills smoke (receipts, not ✓)
        run: php tools/skills-smoke.php

  coverage:
    needs: [draft-state, tests]
    if: ${{ needs.tests.result == 'success' && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Check coverage threshold
        run: |
          LINE_RATE=$(php -r "\$x=simplexml_load_file('coverage.xml');echo (string)\$x->project->metrics['coveredstatements']/(string)\$x->project->metrics['statements'];")
          PERCENT=$(php -r "echo round($LINE_RATE * 100, 2);")
          echo "Coverage: ${PERCENT}%"
          php -r "exit($LINE_RATE < 0.50 ? 1 : 0);"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # RZ-39: the bootstrap locale setup under a threaded SAPI. Classic FrankenPHP,
  # 8 PHP threads: the pre-RZ-39 per-request setlocale() must show another
  # thread a non-UTF-8 LC_CTYPE (the check bites), Razy\Util\Locale must not.
  # glibc and musl images, pinned by digest.
  threaded-sapi:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Threaded SAPI locale (FrankenPHP ${{ matrix.libc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            image: dunglas/frankenphp:1.13.3-php8.3.36-trixie@sha256:18428b297fed09981e891352af83855140110aa06f2ead6bdc7fa2ee0bbe3157
          - libc: musl
            image: dunglas/frankenphp:1.13.3-php8.3.36-alpine@sha256:735ea8a7869b768d457a9c9d2680588b0f1ed8a78abf8b67a94543d7705c4005
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Locale race under FrankenPHP threads
        run: bash tools/frankenphp-locale-race.sh docker "${{ matrix.image }}"

  code-style:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose --format=checkstyle | cs2pr

  static-analysis:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 13w12c: merge-base(origin/master, HEAD) needs the base history.
          fetch-depth: 0

      - name: Action pins are full commit SHAs (WS-30)
        run: python3 .github/action_pins.py

      # WS-34: any tracked file, not only code. -B so the checker writes no __pycache__.
      - name: Consumer name stays out of tracked files (WS-34)
        run: |
          python3 -B .github/test_product_id.py
          python3 -B .github/product_id.py

      # 13w12c: duplicate-code check on src/. About 3 s idle;
      # the cap is 5 min for a busy host. Drafts skip this job.
      - name: Duplicate-code check against origin/master (13w12c)
        timeout-minutes: 5
        run: |
          # -B: importing dupcheck_lex writes tools/__pycache__/.
          python3 -B -m unittest discover -s tools -p 'test_dupcheck.py' -v
          python3 -B tools/dupcheck.py --base origin/master

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # first-party modules (permissions, oauth, apps) under the same level
      - name: Run PHPStan (modules)
        run: vendor/bin/phpstan analyse -c phpstan.modules.neon --no-progress

  discipline:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Module Discipline (Golden Rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint golden demos (blocking — demos must stay rule-clean)
        run: php tools/lint-module-discipline.php demos --strict

      # RZ-009 policy carve-out: await() REGISTRATION inside __onInit is the
      # sanctioned dependency pattern and reports as warn — a legitimate,
      # permanent warn in the await teaching demo. This gate blocks on ERRORS
      # (IO/api/getDB in init proper stay blocking); demos/* and modules/*
      # keep --strict (teach zero-await). (v1 shipped the carve-out as an
      # ADDED step while the --strict twin lived on — CI live-fire caught it.)
      - name: Lint shipped demos (blocking on errors — sanctioned await warns inform)
        run: php tools/lint-module-discipline.php demo_modules

      - name: Lint first-party modules (blocking — same Golden Rules bar as framework code)
        run: php tools/lint-module-discipline.php modules --strict

      - name: Lint rule fixtures (blocking — every matcher, RZ-018 and RZ-019 included)
        run: php tools/lint-module-discipline.php --self-test

      # docs/STYLE.md, checked on the framework source: naming, size caps and
      # strict_types against tools/style-baseline.json, plus RZ-019.
      - name: Framework style lint (blocking — new code meets docs/STYLE.md)
        run: php tools/lint-style.php

  redis-integration:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Redis-backed suites (real server)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Redis-backed suites (skips here are FAILURES — the service exists)
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage --filter "RedisQueueStoreTest|SessionRedisDriverTest|RedisAdapterTest" 2>&1 | tee redis.log
          # The old gate grepped 'Skipped: 0' — a line PHPUnit 11.5 only prints
          # on non-clean summaries: a FULLY GREEN run ("OK (82 tests, …)") had
          # no such line and reddened itself as "skipped". Gate the positive way:
          # an OK summary must appear; anything else (skip lines, failures) fails.
          grep -qE '^OK \([0-9]+ tests' redis.log || { echo "::error::redis-backed suites not fully green (skips or failures — see log above)"; exit 1; }

  postgres-integration:
    needs: draft-state
    if: ${{ !cancelled() && (needs.draft-state.result != 'success' || needs.draft-state.outputs.run == 'true') }}
    name: Postgres-backed suites (real server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: razy
          POSTGRES_PASSWORD: razy
          POSTGRES_DB: razy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U razy -d razy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAZY_TEST_PGSQL_HOST: 127.0.0.1
      RAZY_TEST_PGSQL_PORT: 5432
      RAZY_TEST_PGSQL_DB: razy_test
      RAZY_TEST_PGSQL_USER: razy
      RAZY_TEST_PGSQL_PASSWORD: razy
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, pdo_pgsql, ftp, openssl, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # RZ-02: parameter binding must hold on Postgres (booleans, quotes, JSON,
      # LIKE). RZ-07: the schema DSL and MigrationManager run real DDL here.
      # Skips here are FAILURES — the service exists.
      - name: Run Postgres-backed suites
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage --filter "ParameterBindingTest|SchemaPostgresLiveTest" 2>&1 | tee pg.log
          grep -qE '^OK \([0-9]+ tests' pg.log || { echo "::error::postgres-backed suites not fully green (skips or failures — see log above)"; exit 1; }
