name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 8.5 added by PHP-85-READY (deprecations defused + PHPUnit 11.5); 8.2's
        # floor retires at its EOL (2026-12-31) per readme's support policy.
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Check coverage threshold
        run: |
          LINE_RATE=$(php -r "\$x=simplexml_load_file('coverage.xml');echo (string)\$x->project->metrics['coveredstatements']/(string)\$x->project->metrics['statements'];")
          PERCENT=$(php -r "echo round($LINE_RATE * 100, 2);")
          echo "Coverage: ${PERCENT}%"
          php -r "exit($LINE_RATE < 0.50 ? 1 : 0);"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose --format=checkstyle | cs2pr

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  discipline:
    name: Module Discipline (Golden Rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint golden demos (blocking — demos must stay rule-clean)
        run: php tools/lint-module-discipline.php demos --strict

      # RZ-009 policy carve-out: await() REGISTRATION inside __onInit is the
      # sanctioned dependency pattern and reports as warn — a legitimate,
      # permanent warn in the await teaching demo. This gate blocks on ERRORS
      # (IO/api/getDB in init proper stay blocking); demos/* and modules/*
      # keep --strict (teach zero-await). (v1 shipped the carve-out as an
      # ADDED step while the --strict twin lived on — CI live-fire caught it.)
      - name: Lint shipped demos (blocking on errors — sanctioned await warns inform)
        run: php tools/lint-module-discipline.php demo_modules

      - name: Lint first-party modules (blocking — same Golden Rules bar as framework code)
        run: php tools/lint-module-discipline.php modules --strict

  redis-integration:
    name: Redis-backed suites (real server)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, json, mbstring, pdo_sqlite, ftp, openssl, sodium, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Redis-backed suites (skips here are FAILURES — the service exists)
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage --filter "RedisQueueStoreTest|SessionRedisDriverTest|RedisAdapterTest" 2>&1 | tee redis.log
          # The old gate grepped 'Skipped: 0' — a line PHPUnit 11.5 only prints
          # on non-clean summaries: a FULLY GREEN run ("OK (82 tests, …)") had
          # no such line and reddened itself as "skipped". Gate the positive way:
          # an OK summary must appear; anything else (skip lines, failures) fails.
          grep -qE '^OK \([0-9]+ tests' redis.log || { echo "::error::redis-backed suites not fully green (skips or failures — see log above)"; exit 1; }
